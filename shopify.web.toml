# The Shopify CLI serves the app through a tunnel when running "shopify app dev"
# (or "php artisan shopify:dev"). It exports SHOPIFY_API_KEY, SHOPIFY_API_SECRET,
# APP_URL and SERVER_PORT for the process below, which Laravel picks up over the
# values in ".env". "dev:shopify" records the tunnel's URL as APP_URL in ".env"
# and as application_url and redirect_urls in "shopify.app.toml". The CLI also
# sets APP_ENV to "development", which "dev:shopify" clears so the app keeps the
# environment named in ".env".

roles = ["frontend", "backend"]
webhooks_path = "/webhooks"

[commands]
dev = "composer run dev:shopify"
